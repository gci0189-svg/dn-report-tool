<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>維修單附件合成器</title>
  <style>
    body { font-family: '微軟正黑體', sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center;}
    .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h2 { text-align: center; color: #333; margin-top: 0;}
    .step { margin-bottom: 25px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #444; }
    input[type="file"] { display: block; width: 100%; padding: 10px; border: 2px dashed #ccc; border-radius: 6px; box-sizing: border-box; background: #fafafa; cursor: pointer; }
    button { background: #0056b3; color: white; padding: 14px; border: none; width: 100%; cursor: pointer; font-size: 16px; border-radius: 6px; font-weight: bold; transition: background 0.3s;}
    button:hover { background: #004494; }
    #status { margin-top: 20px; font-weight: bold; text-align: center; font-size: 14px;}
  </style>

  <!-- 載入第三方套件 -->
  <!-- pdf.js 負責「讀取」第一頁的文字 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- pdf-lib 負責「編輯與畫圖」，並產出新 PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <!-- fontkit 負責讓 PDF 支援「中文字體」 -->
  <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>🛠️ 維修單附件合成器</h2>
    <p style="color: #666; font-size: 13px; text-align: center; margin-bottom: 20px;">
      (保留第一頁原版簽名，自動生成第二頁表頭與照片)
    </p>

    <div class="step">
      <label>1. 上傳原版維修紀錄 (PDF)</label>
      <input type="file" id="uploadPdf" accept="application/pdf">
    </div>

    <div class="step">
      <label>2. 附加機台現場照片 (JPG/PNG)</label>
      <input type="file" id="uploadPhoto" accept="image/*">
    </div>

    <button id="generateBtn">產生完整報表</button>
    <div id="status"></div>
  </div>

  <script>
// 設定 PDF.js 的 Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    document.getElementById('generateBtn').addEventListener('click', async () => {
        const pdfFile = document.getElementById('uploadPdf').files[0];
        const photoFile = document.getElementById('uploadPhoto').files[0];
        const statusDiv = document.getElementById('status');

        if (!pdfFile || !photoFile) {
            statusDiv.innerText = "⚠️ 錯誤：請確保 PDF 與照片都已上傳！";
            statusDiv.style.color = "red";
            return;
        }

        statusDiv.innerText = "⏳ 正在套用原廠工程藍圖，請稍候...";
        statusDiv.style.color = "blue";

        try {
            // ==========================================
            // 步驟 A：讀取文字，精準抓號碼
            // ==========================================
            const pdfArrayBuffer = await pdfFile.arrayBuffer();
            const pdfJsDoc = await pdfjsLib.getDocument({ data: pdfArrayBuffer }).promise;
            const page = await pdfJsDoc.getPage(1);
            const textContent = await page.getTextContent();
            const fullText = textContent.items.map(item => item.str).join(' ');

            const ticketMatch = fullText.match(/報案流水號[^\d]*(\d+)/);
            const taskMatch = fullText.match(/任務\s*No[^\d]*(\d+)/i); 
            const ticketNo = ticketMatch ? ticketMatch[1] : "";
            const taskNo = taskMatch ? taskMatch[1] : "";

            // ==========================================
            // 步驟 B：使用 pdf-lib 開始修改 PDF
            // ==========================================
            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            const pdfDoc = await PDFDocument.load(pdfArrayBuffer);

            pdfDoc.registerFontkit(fontkit);
            const helveticaFont = await pdfDoc.embedFont(StandardFonts.Helvetica);
            const fontUrl = 'https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf';
            const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
            const customFont = await pdfDoc.embedFont(fontBytes);

            const newPage = pdfDoc.addPage([595.28, 841.89]);

            // ==========================================
            // 步驟 C：【公釐 (mm) 級距精準定位系統】
            // ==========================================
            
            // 1 mm = 2.83465 pt
            const mm2pt = 2.83465;
            const pageH = 841.89; // A4 總高度

            // 依據尺規截圖設定 X 軸座標 (由左至右)
            const marginL = 15 * mm2pt;      // 左側文字與底線起點 (15mm)
            const tableLeftX = 102 * mm2pt;  // 表格左框線 (102mm)
            const splitX = 151 * mm2pt;      // 表格中間分隔線 (151mm)
            const marginR = 195 * mm2pt;     // 表格右框線與底線終點 (195mm)

            // 依據尺規截圖設定 Y 軸座標 (由上而下，需用 pageH 減去)
            const tableTopY = pageH - (28 * mm2pt);     // 表格最上緣 (距離頂部 28mm)
            const rowH = 4 * mm2pt;                     // 每一列高度 (精準 4mm，非常扁平)
            const tableBottomY = tableTopY - (rowH * 3); // 表格最下緣 (距離頂部 40mm)
            
            const lineY = pageH - (46.5 * mm2pt);       // 黑色長分隔線 (距離頂部 46.5mm)

            // 1. 左側標題 (精準對齊)
            // Diebold Nixdorf 約在頂部 32.5mm，維修紀錄約在 38.5mm
            newPage.drawText('Diebold Nixdorf', { x: marginL, y: pageH - (32.5 * mm2pt), size: 14, font: helveticaFont, color: rgb(0, 0, 0) });
            newPage.drawText('維修紀錄', { x: marginL, y: pageH - (38.5 * mm2pt), size: 16, font: customFont, color: rgb(0, 0, 0) });

            // 2. 畫表格外框與線條 (1 pt 粗細)
            const lineThick = 1;
            newPage.drawRectangle({ x: tableLeftX, y: tableBottomY, width: marginR - tableLeftX, height: rowH * 3, borderColor: rgb(0, 0, 0), borderWidth: lineThick });
            newPage.drawLine({ start: { x: tableLeftX, y: tableTopY - rowH }, end: { x: marginR, y: tableTopY - rowH }, thickness: lineThick, color: rgb(0, 0, 0) });
            newPage.drawLine({ start: { x: tableLeftX, y: tableTopY - (rowH * 2) }, end: { x: marginR, y: tableTopY - (rowH * 2) }, thickness: lineThick, color: rgb(0, 0, 0) });
            newPage.drawLine({ start: { x: splitX, y: tableBottomY }, end: { x: splitX, y: tableTopY }, thickness: lineThick, color: rgb(0, 0, 0) });

            // 3. 填入表格文字 (精準的 10 pt，並設定完美垂直對齊)
            const fontSize = 10;
            const textOffsetY = 1.2 * mm2pt; // 讓字體底部距離格線約 1.2mm
            
            const textY1 = tableTopY - rowH + textOffsetY;
            const textY2 = tableTopY - (rowH * 2) + textOffsetY;
            const textY3 = tableBottomY + textOffsetY;

            // 左欄中文 (絕對靠右，距離中線 1.5mm)
            const labelRightEdge = splitX - (1.5 * mm2pt);
            const w1 = customFont.widthOfTextAtSize('報案流水號', fontSize);
            newPage.drawText('報案流水號', { x: labelRightEdge - w1, y: textY1, size: fontSize, font: customFont });
            const w2 = customFont.widthOfTextAtSize('任務 No.', fontSize);
            newPage.drawText('任務 No.', { x: labelRightEdge - w2, y: textY2, size: fontSize, font: customFont });
            const w3 = customFont.widthOfTextAtSize('值班 No.', fontSize);
            newPage.drawText('值班 No.', { x: labelRightEdge - w3, y: textY3, size: fontSize, font: customFont });

            // 右欄數字 (絕對靠左，距離中線 1.5mm，使用 Helvetica)
            const valueLeftEdge = splitX + (1.5 * mm2pt);
            newPage.drawText(ticketNo, { x: valueLeftEdge, y: textY1, size: fontSize, font: helveticaFont });
            newPage.drawText(taskNo,   { x: valueLeftEdge, y: textY2, size: fontSize, font: helveticaFont });

            // 4. 底部的黑色長分隔線
            newPage.drawLine({ start: { x: marginL, y: lineY }, end: { x: marginR, y: lineY }, thickness: lineThick, color: rgb(0, 0, 0) });

            // ==========================================
            // 步驟 D：插入機台照片 (解除縮小限制，並以橫線為基準定位)
            // ==========================================
            const photoArrayBuffer = await photoFile.arrayBuffer();
            let image;
            if (photoFile.type === 'image/jpeg') {
                image = await pdfDoc.embedJpg(photoArrayBuffer);
            } else if (photoFile.type === 'image/png') {
                image = await pdfDoc.embedPng(photoArrayBuffer);
            } else {
                throw new Error("只支援 JPG 或 PNG 格式！");
            }

            // 放開限制，允許圖片最大寬度為 170mm (幾乎佔滿左右寬度)
            const scaledDims = image.scaleToFit(170 * mm2pt, 200 * mm2pt);
            
            // 圖片水平置中
            const imgX = (595.28 - scaledDims.width) / 2;
            // 圖片頂部距離上方黑線約 6mm
            const imgY = lineY - (6 * mm2pt) - scaledDims.height; 

            newPage.drawImage(image, { x: imgX, y: imgY, width: scaledDims.width, height: scaledDims.height });

            // ==========================================
            // 步驟 E：打包下載
            // ==========================================
            const modifiedPdfBytes = await pdfDoc.save();
            const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `維修紀錄_${ticketNo}_含附件.pdf`;
            link.click();

            statusDiv.innerText = `✅ 成功！已抓取 流水號: ${ticketNo} / 任務號: ${taskNo}`;
            statusDiv.style.color = "green";

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "❌ 發生錯誤：" + error.message;
            statusDiv.style.color = "red";
        }
    });</script>
</body>
</html>
